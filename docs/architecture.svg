<svg viewBox="0 0 1100 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1100" height="620" fill="#ffffff"/>

  <!-- ===== User ===== -->
  <g>
    <circle cx="110" cy="150" r="42" fill="#eef2ff" stroke="#6366f1" stroke-width="2.5"/>
    <circle cx="110" cy="136" r="12" fill="#6366f1"/>
    <path d="M86 172 Q110 148 134 172" fill="none" stroke="#6366f1" stroke-width="3.5" stroke-linecap="round"/>
    <text x="110" y="232" text-anchor="middle" font-size="15" fill="#111827" font-weight="700">User</text>
  </g>

  <!-- problem arrow: user -> generation box -->
  <line x1="156" y1="150" x2="374" y2="150" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="265" y="134" text-anchor="middle" font-size="13" fill="#334155" font-weight="600">problem</text>

  <!-- extend canvas headroom so returning arrow clears the User label -->
  <rect x="0" y="0" width="1" height="1" fill="none"/>

  <!-- ===== Generation layer ===== -->
  <rect x="380" y="40" width="480" height="220" rx="18" fill="#fafafa" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7,5"/>
  <text x="620" y="24" text-anchor="middle" font-size="12" fill="#64748b" font-weight="700" letter-spacing="1">GENERATION LAYER · PARALLEL</text>

  <!-- Groq -->
  <circle cx="500" cy="150" r="75" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
  <text x="500" y="147" text-anchor="middle" font-size="20" fill="#9a3412" font-weight="700">Groq</text>
  <text x="500" y="169" text-anchor="middle" font-size="11" fill="#9a3412">solution generator</text>

  <!-- Cohere -->
  <circle cx="740" cy="150" r="75" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="740" y="147" text-anchor="middle" font-size="20" fill="#1e40af" font-weight="700">Cohere</text>
  <text x="740" y="169" text-anchor="middle" font-size="11" fill="#1e40af">solution generator</text>

  <!-- ===== Judge (diamond) ===== -->
  <polygon points="770,340 850,420 770,500 690,420" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/>
  <text x="770" y="414" text-anchor="middle" font-size="18" fill="#5b21b6" font-weight="700">Judge</text>
  <text x="770" y="434" text-anchor="middle" font-size="12" fill="#5b21b6" font-weight="600">Gemini</text>

  <!-- solution_1: Groq -> Judge left vertex -->
  <line x1="522" y1="215" x2="700" y2="410" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="558" y="300" text-anchor="middle" font-size="13" fill="#334155" font-weight="600">solution_1</text>

  <!-- solution_2: Cohere -> Judge top vertex -->
  <line x1="748" y1="225" x2="766" y2="330" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="815" y="285" text-anchor="middle" font-size="13" fill="#334155" font-weight="600">solution_2</text>

  <!-- ===== Result box ===== -->
  <rect x="140" y="400" width="250" height="140" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="165" y="432" font-size="13" fill="#166534" font-weight="700">Solution_1</text>
  <text x="165" y="456" font-size="13" fill="#166534" font-weight="700">Solution_2</text>
  <text x="165" y="480" font-size="13" fill="#166534" font-weight="700">Score for both</text>
  <text x="165" y="504" font-size="13" fill="#166534" font-weight="700">the solutions</text>

  <!-- score arrow: Judge left vertex -> Result box -->
  <line x1="688" y1="425" x2="396" y2="460" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="540" y="428" text-anchor="middle" font-size="13" fill="#334155" font-weight="600">score for both solutions</text>

  <!-- result -> user -->
  <path d="M225 398 C170 320 135 250 118 196" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
</svg>
